version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: legal_ai_db
    environment:
      POSTGRES_DB: legal_ai_assessment
      POSTGRES_USER: legal_ai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_ai_password_2024}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_ai_user -d legal_ai_assessment"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal_ai_network

  backend:
    build: ./backend
    container_name: legal_ai_backend
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/exports:/app/data/exports
      - ./data/temp:/app/data/temp
      - ./logs:/app/logs
    environment:
      - DATA_DIR=/app/data
      - MAX_FILE_SIZE=10485760
      - DATABASE_URL=postgresql://legal_ai_user:${POSTGRES_PASSWORD:-legal_ai_password_2024}@db:5432/legal_ai_assessment
      - ENVIRONMENT=production
      - DEBUG=false
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal_ai_network

  nginx:
    image: nginx:alpine
    container_name: legal_ai_nginx
    volumes:
      - ./data/uploads:/usr/share/nginx/html/uploads
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-react/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - legal_ai_network

networks:
  legal_ai_network:
    driver: bridge