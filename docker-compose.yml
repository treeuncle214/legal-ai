services:
  db:
    image: postgres:15-alpine
    container_name: legal_ai_db
    environment:
      POSTGRES_DB: legal_ai_assessment
      POSTGRES_USER: legal_ai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置强随机 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_ai_user -d legal_ai_assessment"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal_ai_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal_ai_backend
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/exports:/app/data/exports
      - ./data/temp:/app/data/temp
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DATA_DIR=/app/data
      - MAX_FILE_SIZE=10485760
      - DATABASE_URL=postgresql://legal_ai_user:${POSTGRES_PASSWORD:?请在 .env 中设置强随机 POSTGRES_PASSWORD}@db:5432/legal_ai_assessment
      - ENVIRONMENT=production
      - DEBUG=false
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - SECRET_KEY=${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:?请在 .env 中设置 REFRESH_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal_ai_network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal_ai_nginx
    volumes:
      - ./data/uploads:/usr/share/nginx/html/uploads
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - legal_ai_network

networks:
  legal_ai_network:
    driver: bridge