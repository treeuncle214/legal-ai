# docker-compose.yml
version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./data/uploads:/app/data/uploads  # 持久化存储
      - ./data/exports:/app/data/exports
    environment:
      - DATA_DIR=/app/data
      - MAX_FILE_SIZE=10485760
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./data/uploads:/usr/share/nginx/html/uploads  # 静态文件服务
    ports:
      - "80:80"