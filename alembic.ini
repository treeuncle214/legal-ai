# Alembic 配置文件
# 数据库地址不在此硬编码，而是由 alembic/env.py 从 backend.database.engine 读取，
# 自动跟随 .env 中的 DATABASE_URL（SQLite / PostgreSQL）。

[alembic]
script_location = alembic
prepend_sys_path = .
# env.py 会覆盖此处的 sqlalchemy.url
sqlalchemy.url =

# 迁移脚本文件名模板
file_template = %%(rev)s_%%(slug)s

# 时间戳格式
timezone =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
